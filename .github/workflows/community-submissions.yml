name: Process Community Submissions

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
  schedule:
    - cron: "39 4 * * *"

permissions:
  contents: write
  issues: read

concurrency:
  group: omp-community-submissions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import community submissions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/community_ingest.py

      - name: Generate unified indexes
        run: python scripts/unify_index.py

      - name: Validate current research data
        run: python scripts/core.py validate

      - name: Commit generated records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- problems/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update community research submissions"
            git push
          fi
