name: Update research index
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
  discussions: read
concurrency:
  group: update-research-index
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/core.py all
          python scripts/unify_index.py
      - name: Commit generated records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/problems.json data/claims.json data/notices.json docs/*.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public research index'
            git push
          fi
